[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cape-wm"
version = "0.1.0"
description = "Calibrated Adaptive Planning and Execution for latent world models"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "torch==2.5.1",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
stablewm = [
  "stable-worldmodel==0.1.1",
  "stable-pretraining==0.1.8",
  "torchvision==0.20.1",
  "transformers>=4.50,<5",
  "h5py>=3.12,<4",
  "hdf5plugin>=5,<8",
  "scikit-learn>=1.5,<2",
  "imageio[ffmpeg]>=2.35,<3",
]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]

[project.scripts]
cape-wm-toy = "cape_wm.cli:toy_main"
cape-wm-evaluate = "cape_wm.cli:evaluate_main"
cape-wm-smoke = "cape_wm.smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
