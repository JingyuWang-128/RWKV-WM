<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2148" height="750" viewBox="0 0 1432 500" role="img" aria-labelledby="title desc">
  <title id="title">反事实中心化 RWKV 世界模型方法概览</title>
  <desc id="desc">中文双面板流程图，展示反事实中心化 RWKV 矩阵递推，以及多步配对训练与评估。</desc>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#26333F"/>
    </marker>
    <marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#D55E00"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#0072B2"/>
    </marker>
    <style>
      .panel { fill:#FFFFFF; stroke:#AAB4BF; stroke-width:2; }
      .head { fill:#26333F; }
      .title { font-family:'Noto Sans CJK SC','Droid Sans Fallback',sans-serif; font-size:23px; font-weight:700; fill:#FFFFFF; }
      .main { font-family:'Noto Sans CJK SC','Droid Sans Fallback',sans-serif; font-size:21px; font-weight:700; fill:#26333F; }
      .text { font-family:'Noto Sans CJK SC','Droid Sans Fallback',sans-serif; font-size:18px; font-weight:400; fill:#34424F; }
      .sub { font-family:'Noto Sans CJK SC','Droid Sans Fallback',sans-serif; font-size:16px; font-weight:400; fill:#536170; }
      .neutral { fill:#F4F6F8; stroke:#667585; stroke-width:1.8; }
      .factual { fill:#FBE9DF; stroke:#D55E00; stroke-width:2.2; }
      .noop { fill:#E7F2F8; stroke:#0072B2; stroke-width:2.2; stroke-dasharray:8 5; }
      .effect { fill:#E5F3EE; stroke:#009E73; stroke-width:2.2; }
      .loss { fill:#F2EAF3; stroke:#8A4F8F; stroke-width:2; }
      .line { fill:none; stroke:#26333F; stroke-width:2.2; marker-end:url(#arrow); }
      .orange { fill:none; stroke:#D55E00; stroke-width:2.4; marker-end:url(#arrowOrange); }
      .blue { fill:none; stroke:#0072B2; stroke-width:2.4; stroke-dasharray:8 5; marker-end:url(#arrowBlue); }
    </style>
  </defs>

  <rect width="1432" height="500" fill="#FFFFFF"/>

  <!-- Panel A: centered recurrent transition -->
  <rect class="panel" x="18" y="18" width="690" height="464" rx="8"/>
  <path class="head" d="M26 18 H700 Q708 18 708 26 V66 H18 V26 Q18 18 26 18 Z"/>
  <text class="title" x="39" y="50">(a) 反事实中心化 RWKV 矩阵递推</text>

  <rect class="neutral" x="57" y="92" width="155" height="57" rx="8"/>
  <text class="main" x="134" y="127" text-anchor="middle">zₜ，Mₜ</text>
  <rect class="factual" x="282" y="92" width="155" height="57" rx="8"/>
  <text class="main" x="359" y="127" text-anchor="middle">实际动作 uₜ</text>
  <rect class="noop" x="504" y="92" width="155" height="57" rx="8"/>
  <text class="main" x="581" y="127" text-anchor="middle">参考动作 0</text>

  <path class="line" d="M134 149 V190"/>
  <path class="orange" d="M359 149 V190"/>
  <path class="blue" d="M581 149 V190"/>

  <rect class="neutral" x="46" y="192" width="235" height="78" rx="9"/>
  <text class="main" x="163" y="224" text-anchor="middle">自主世界更新</text>
  <text class="text" x="163" y="253" text-anchor="middle">环境、漂移与历史效应</text>

  <rect class="effect" x="323" y="192" width="336" height="78" rx="9"/>
  <text class="main" x="491" y="224" text-anchor="middle">中心化动作效应</text>
  <text class="text" x="491" y="253" text-anchor="middle">fₐ(uₜ) − fₐ(0)</text>

  <path class="line" d="M163 270 V310 H259 V331"/>
  <path class="line" d="M491 270 V310 H447 V331"/>

  <rect class="effect" x="67" y="333" width="592" height="92" rx="10"/>
  <text class="main" x="363" y="364" text-anchor="middle">更新 RWKV 矩阵状态</text>
  <text class="text" x="363" y="394" text-anchor="middle">Mₜ₊₁ = Φ世界(Mₜ,zₜ) + [Φ动作(uₜ) − Φ动作(0)]</text>
  <text class="sub" x="363" y="417" text-anchor="middle">中心化衰减 · 擦除 · 写入；动作不能绕过矩阵直达输出</text>

  <path class="line" d="M363 425 V459"/>
  <text class="main" x="363" y="475" text-anchor="middle">预测下一潜状态 ẑₜ₊₁</text>

  <!-- Panel B: paired training and evaluation -->
  <rect class="panel" x="726" y="18" width="688" height="464" rx="8"/>
  <path class="head" d="M734 18 H1406 Q1414 18 1414 26 V66 H726 V26 Q726 18 734 18 Z"/>
  <text class="title" x="747" y="50">(b) 多步配对训练与评估</text>

  <rect class="neutral" x="859" y="91" width="422" height="63" rx="9"/>
  <text class="main" x="1070" y="118" text-anchor="middle">从同一 (Mₜ, zₜ) 克隆两个临时分支</text>
  <text class="sub" x="1070" y="143" text-anchor="middle">后续采用 free-running，不再输入真实未来观测</text>

  <path class="orange" d="M1070 154 V179 H883 V200"/>
  <path class="blue" d="M1070 154 V179 H1257 V200"/>

  <rect class="factual" x="767" y="202" width="232" height="75" rx="9"/>
  <text class="main" x="883" y="232" text-anchor="middle">事实分支</text>
  <text class="text" x="883" y="260" text-anchor="middle">[uₜ, uₜ₊₁, …]</text>

  <rect class="noop" x="1141" y="202" width="232" height="75" rx="9"/>
  <text class="main" x="1257" y="232" text-anchor="middle">脉冲零动作分支</text>
  <text class="text" x="1257" y="260" text-anchor="middle">[0, uₜ₊₁, …]</text>

  <path class="orange" d="M883 277 V306 H978 V326"/>
  <path class="blue" d="M1257 277 V306 H1162 V326"/>

  <rect class="loss" x="802" y="328" width="536" height="94" rx="10"/>
  <text class="main" x="1070" y="358" text-anchor="middle">位置平衡的多步训练目标</text>
  <text class="text" x="1070" y="388" text-anchor="middle">L事实 + L零动作 + λ效应 L配对效应</text>
  <text class="sub" x="1070" y="413" text-anchor="middle">同时约束效应方向与幅值；仅事实主状态推进到 t+1</text>

  <path class="line" d="M1070 422 V451"/>
  <text class="main" x="1070" y="472" text-anchor="middle">H 步评估：RMSE · CEE · 生效延迟 · 持续性</text>

  <path class="line" d="M708 250 H726"/>
</svg>
