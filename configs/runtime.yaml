# Portable runtime settings. This is the only hardware configuration file.
# "auto" selects an available accelerator and falls back to CPU.
runtime:
  device: auto
  num_workers: 0
  pin_memory: auto
  torch_num_threads: 8
  torch_num_interop_threads: 1
  latent_batch_size: 128

training:
  macro_batch_size: 64
  risk_batch_size: 64
  trm_batch_size: 64
