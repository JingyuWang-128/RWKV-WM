base_config: base.yaml

experiment:
  name: cc_rwkv_m5_tworoom_w
  environment: swm/TwoRoom-v1+EpisodeConstantDrift
  task_kind: deterministic_navigation_hidden_drift

assets:
  data: /data/wjy/lewm_data/tworoom.h5
  weights: /data/wjy/lewm_model/tworooms/weights.pt
  model_config: /data/wjy/lewm_model/tworooms/config.json
  frozen_test_episodes: artifacts/results/lewm_tworooms_long_matrix_gpu_final/matrix_episodes.jsonl

protocol:
  variant: tworoom_w
  drift_amplitude_pixels_per_primitive_step: 0.5
  drift_directions: 8
  action_block: 5
  observation_stride: 5
  m5_model_horizons: [1, 2, 4]
  m5_primitive_horizons: [5, 10, 20]
  training_seeds: [0, 1, 2]
  effect_weight_search: [0.5, 1.0, 2.0]
  bootstrap_seed: 3072
  bootstrap_samples: 10000

paths:
  dataset: artifacts/cache/cc_rwkv/tworoom_w/mvp5000/branches.h5
  output_root: artifacts/results/cc_rwkv/m5/tworoom_w
