# JEPA-RWKV World Model Configuration for Atari
# Uses deterministic embeddings with SIGReg instead of VAE-style stochastic latents

Task: "JointTrainAgent"

BasicSettings:
  Seed: 0
  ObsShape: (64, 64, 3)
  UseAmp: False
  FrameSkip: 4

JointTrainAgent:
  SampleMaxSteps: 102000
  BufferMaxLength: 102000
  BufferWarmUp: 1024
  NumEnvs: 1
  BatchSize: 16
  BatchLength: 64
  ImagineBatchSize: 16
  ImagineContext: 64
  ImagineHorizon: 15
  TrainModelEverySteps: 1
  TrainAgentEverySteps: 1
  AgentUpdate: 1
  SaveEverySteps: 2000
  VideoLogStep: 2000

# Use JEPA world model instead of VAE-based ParallelWorldModel
WorldModelType: "jepa"

Models:
  # Core dimensions - JEPA uses only hidden (no stoch+hidden concatenation)
  Hidden: 512
  NumBin: 255
  MaxBin: 20
  NumSample: 16
  Act: "SiLU"

  # Discount and TD-lambda
  Gamma: 0.997
  Lambda: 0.95
  Tau: 0.01

  # ==================== JEPA World Model ====================
  WorldModel:
    # CNN Encoder
    Stem: 32            # Initial CNN channels
    MinRes: 4           # Minimum spatial resolution

    # Learning rate
    LR: 1e-4
    Eps: 1e-8

    # RWKV Predictor
    RWKVLayers: 4       # Number of RWKV blocks
    RWKVHeads: 8        # Attention heads per block
    RWKVExpandFactor: 4 # FFN expansion ratio

    # Self-Attention (optional, after CNN)
    UseSelfAttention: false
    SelfAttnHeads: 4

    # SIGReg Regularization (prevents feature collapse)
    SIGRegWeight: 0.09
    SIGRegKnots: 17
    SIGRegNumProj: 1024

    # Decoder (optional, for physical consistency)
    # Weight decays from initial to minimum over DecaySteps
    DecoderWeightInit: 1.0    # Initial reconstruction loss weight
    DecoderWeightMin: 0.0     # Minimum weight (0 = pure JEPA)
    DecoderDecaySteps: 50000  # Steps to decay from init to min
    DecoderDecayType: "linear" # linear, exponential, or cosine

  # ==================== Actor-Critic Agent ====================
  Agent:
    EntropyCoef: 3e-4
    LR: 3e-5
    Eps: 1e-5
    MinPer: 0.05
    MaxPer: 0.95
    EMADecay: 0.99

# Hyperparameter Notes:
# ---------------------
# SIGRegWeight: 0.09 is the default from LeWorldModel paper
#   - Higher values enforce stronger Gaussian constraint
#   - Lower values allow more flexible representations
#   - Recommended range: [0.01, 0.5]
#
# DecoderWeightInit: Controls early physical grounding
#   - 1.0: Full reconstruction loss initially
#   - 0.0: Pure JEPA from the start (no reconstruction)
#   - Reconstruction helps RWKV learn meaningful dynamics early
#
# RWKVLayers: Number of RWKV blocks
#   - 4 layers is a good balance of capacity vs compute
#   - For complex games, try 6 layers
#   - For simple games, 2 layers may suffice
#
# UseSelfAttention: Expands CNN receptive field
#   - Enable for games with global dependencies
#   - Adds ~20% compute overhead
